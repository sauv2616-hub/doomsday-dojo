document.addEventListener('input',e=>{if(['sd','sy'].includes(e.target.id)){SV.revealed=false;$('#sres').innerHTML='';}});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('lesson')&&e.target.open)openLesson=e.target.id.slice(2);},true);
document.addEventListener('keydown',e=>{
  if(G){if(G.reveal){if(e.key==='Enter'||e.key===' '){e.preventDefault();gNext();}}else if(/^[0-6]$/.test(e.key))gAnswer(+e.key);if(e.key==='Escape')gQuit();return;}
  if(SH&&e.key==='Enter'){startDrill(SH.id,SH.mode);return;}
  if(SH&&e.key==='Escape'){closeSheet();return;}
  if(!R)return;
  if(e.key==='Escape'){quitDrill();return;}
  if(R.done){if(e.key==='Enter'){const id=R.id,mode=R.mode;R=null;startDrill(id,mode);}return;}
  if(R.locked){if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}return;}
  const st=R.q.steps[R.si];
  if(st.type==='keypad'){if(/^\d$/.test(e.key))keypad(e.key);else if(e.key==='Backspace')keypad('del');else if(e.key==='Enter')keypad('ok');}
  else if(st.type==='yesno'){if(/^[yl1]$/i.test(e.key))answer(1);else if(/^[nc0]$/i.test(e.key))answer(0);}
  else if(/^[0-6]$/.test(e.key))answer(+e.key);
});

/* ---------- painterly skin ---------- */
// Everything is painted once at startup with a seeded random generator, so the look is identical on every visit.
function rng32(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const svgURL=s=>`url("data:image/svg+xml,${encodeURIComponent(s)}")`;
// Ragged outline in a 100×100 box, stretched over the element. jx/jy = how far edges wander (% of width/height).
function roughMask(seed,jx,jy,n){
  const r=rng32(seed),p=[],e=j=>(r()-.5)*j;n=n||22;
  for(let i=0;i<=n;i++)p.push([i*100/n,jy/2+e(jy)]);
  for(let i=1;i<=n;i++)p.push([100-jx/2+e(jx),i*100/n]);
  for(let i=n-1;i>=0;i--)p.push([i*100/n,100-jy/2+e(jy)]);
  for(let i=n-1;i>0;i--)p.push([jx/2+e(jx),i*100/n]);
  return svgURL(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><path d='M${p.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join('L')}Z'/></svg>`);
}
// A single brush swipe: wavy top/bottom, frayed bristle ends
function swipeMask(seed){
  const r=rng32(seed),top=[],bot=[];
  for(let i=0;i<=30;i++){const x=3+i*94/30,w=Math.sin(i/30*Math.PI);top.push([x,10-w*6+(r()-.5)*5]);bot.push([x,90+w*6-(r()-.5)*5]);}
  const endL=[],endR=[];for(let y=12;y<=88;y+=6){endL.push([(r()*3.5),y]);endR.push([100-r()*3.5,y]);}
  const pts=[...top,...endR,...bot.reverse(),...endL.reverse()];
  return svgURL(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' preserveAspectRatio='none'><path d='M${pts.map(q=>q[0].toFixed(2)+' '+q[1].toFixed(2)).join('L')}Z'/></svg>`);
}
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}
// loose oil strokes: a bundle of thin parallel bristle lines along a gentle curve
function stroke(x,r,cx,cy,len,wid,ang,col,alpha){
  x.save();x.translate(cx,cy);x.rotate(ang);x.strokeStyle=col;x.lineCap='round';
  const bristles=Math.max(3,wid/2|0),bend=(r()-.5)*len*.35;
  for(let b=0;b<bristles;b++){const off=(b/bristles-.5)*wid;x.globalAlpha=alpha*(.45+r()*.55);x.lineWidth=1.2+r()*2.4;
    x.beginPath();x.moveTo(-len/2,off);x.quadraticCurveTo(0,off+bend,len/2*(.8+r()*.25),off+(r()-.5)*3);x.stroke();}
  x.restore();
}
function grainTexture(){
  const [c,x]=canvas(160,160),im=x.createImageData(160,160),r=rng32(11);
  for(let i=0;i<im.data.length;i+=4){const v=105+r()*150|0;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255;}
  x.putImageData(im,0,0);x.globalAlpha=.07;           // linen weave
  for(let i=0;i<160;i+=2){x.fillStyle=i%4?'#000':'#fff';x.fillRect(0,i,160,1);x.fillRect(i,0,1,160);}
  return c.toDataURL();
}
function tileTexture(base,cols,seed,a){
  const [c,x]=canvas(240,240),r=rng32(seed);x.fillStyle=base;x.fillRect(0,0,240,240);
  for(let i=0;i<90;i++){const cx=r()*240,cy=r()*240;for(const dx of [-240,0,240])for(const dy of [-240,0,240])
    {const rr=rng32(seed*977+i);stroke(x,rr,cx+dx,cy+dy,30+rr()*70,6+rr()*14,-.5+rr()*.5,cols[i%cols.length],a);}}
  return c.toDataURL('image/jpeg',.82);
}
function backdropTexture(dark){
  const W=540,H=1080,[c,x]=canvas(W,H),r=rng32(dark?2026:1453);
  const base=dark?'#111b27':'#e6d7b8',cool=dark?['#18283a','#1f3650','#264766','#1b3a4a','#2b5a74','#0e1621']:['#eadcc0','#dfcca7','#f1e6cf','#d8c39b','#e9d6b0','#cdb48a'],
        warm=dark?['#a5662a','#c8862f','#8a3b2e','#e0a43a']:['#c98a3a','#b5651d','#9a4a2a','#d9a650'];
  x.fillStyle=base;x.fillRect(0,0,W,H);
  for(let i=0;i<520;i++)stroke(x,r,r()*W,r()*H,50+r()*190,10+r()*30,-.9+r()*.6,cool[i%cool.length],dark?.32:.4);
  // warm glow at the corners, like the edge of a sunset canvas
  for(let i=0;i<70;i++){const corner=i%2?[r()*W*.5,r()*H*.12]:[W-r()*W*.5,H-r()*H*.14];
    stroke(x,r,corner[0],corner[1],40+r()*120,8+r()*18,-.8+r()*.5,warm[i%warm.length],dark?.22:.25);}
  // splatters
  for(let s=0;s<9;s++){const sx=r()*W,sy=r()<.5?r()*H*.18:H-r()*H*.2,col=warm[s%warm.length];x.fillStyle=col;
    for(let d=0;d<26;d++){x.globalAlpha=.25+r()*.45;x.beginPath();const rad=r()*r()*7+.6;x.arc(sx+(r()-.5)*90,sy+(r()-.5)*70,rad,0,7);x.fill();}}
  return c.toDataURL('image/jpeg',.8);
}
const SKIN={};
function paintSkin(){
  const pref=S.settings.theme||'dark',dark=pref==='auto'?!matchMedia('(prefers-color-scheme: light)').matches:pref!=='paper';
  document.documentElement.dataset.theme=dark?'dark':'paper';
  const css=document.documentElement.style,key=dark?'d':'p';
  if(!SKIN.grain){
    SKIN.grain=grainTexture();
    SKIN.paper=tileTexture('#efe3c6',['#e4d4b2','#f6ecd8','#e9dbbd','#d9c6a1'],5,.35);
    css.setProperty('--tex-grain',`url(${SKIN.grain})`);css.setProperty('--tex-paper',`url(${SKIN.paper})`);
    [['--m-a',roughMask(1,2.2,3.2)],['--m-b',roughMask(2,2.6,2.8)],['--m-c',roughMask(3,1.8,3.6)],['--m-chip',roughMask(4,7,12,10)],
     ['--m-strip',roughMask(5,0,10,40)],['--m-swipe',swipeMask(6)]].forEach(([k,v])=>css.setProperty(k,v));
  }
  if(!SKIN[key]){SKIN[key]={panel:dark?tileTexture('#1a2a3b',['#22364b','#15222f','#284058','#1d3343'],9,.45):tileTexture('#f3e9d3',['#eadcbf','#f8f0de','#e3d2af'],9,.4),backdrop:backdropTexture(dark)};}
  css.setProperty('--tex-panel',`url(${SKIN[key].panel})`);css.setProperty('--tex-backdrop',`url(${SKIN[key].backdrop})`);
  document.querySelectorAll('meta[name=theme-color]').forEach(m=>{m.removeAttribute('media');m.content=dark?'#0d151f':'#dccba8';});
}
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if((S.settings.theme||'dark')==='auto')paintSkin();});

/* ---------- opening scene: the ages of humanity ----------
   Painted once per screen size onto a fixed canvas behind the Daily start screen.
   Left to right: Rome → Industrial Revolution → modern city → far future, under a dusk sky with a Dyson sphere. */
function drawScene(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1),w=innerWidth,h=innerHeight;
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const r=rng32(1453),U=Math.min(w/375,h/700)*1.15,H0=Math.min(h*.68,h-250);
  const wob=(pts,j)=>{x.beginPath();pts.forEach((p,i)=>{const px=p[0]+(r()-.5)*j,py=p[1]+(r()-.5)*j;i?x.lineTo(px,py):x.moveTo(px,py);});x.closePath();};
  const rect=(x0,y0,ww,hh,col)=>{x.fillStyle=col;wob([[x0,y0+hh],[x0,y0],[x0+ww,y0],[x0+ww,y0+hh]],1.2*U);x.fill();};
  const dot=(cx,cy,rad,col,a)=>{x.globalAlpha=a;x.fillStyle=col;x.beginPath();x.arc(cx,cy,rad,0,7);x.fill();x.globalAlpha=1;};

  // --- sky: dusk bands blended with horizontal brush strokes (no smooth gradients)
  const sky=['#0b1626','#0f1e35','#142a45','#1b3654','#24435e','#3a4b62','#6a5160','#a8644a','#d9823f'];
  const bh=H0/sky.length;
  sky.forEach((c,i)=>{x.fillStyle=c;x.fillRect(0,i*bh,w,bh+1);});
  for(let k=0;k<900;k++){const y=r()*H0,i=Math.min(sky.length-1,Math.floor(y/bh)+(r()<.5?0:(r()<.5?1:-1)));
    stroke(x,r,r()*w,y,50+r()*170,5+r()*12,(r()-.5)*.12,sky[Math.max(0,i)],.55);}
  // warm afterglow behind the ancient city, cooler toward the future
  for(let k=0;k<110;k++)stroke(x,r,r()*w*.55,H0-r()*h*.14,40+r()*120,5+r()*10,(r()-.5)*.1,['#f0a04a','#e07a3a','#f2c14b'][k%3],.22);
  for(let k=0;k<70;k++)stroke(x,r,w*.6+r()*w*.4,H0-r()*h*.18,40+r()*110,5+r()*9,(r()-.5)*.1,['#2b6f86','#3fb0a6','#24506e'][k%3],.18);
  // stars
  for(let k=0;k<140;k++){const sy=r()*H0*.55;dot(r()*w,sy,r()*1.3+.3,'#fff3dc',.25+r()*.6*(1-sy/(H0*.55)));}
  // a thin crescent moon over Rome
  const mx=w*.1,my=H0-118*U,mr=10*U;
  { const [mc,m]=canvas(Math.ceil(mr*2+4),Math.ceil(mr*2+4));m.fillStyle='#f3e3c0';m.beginPath();m.arc(mr+2,mr+2,mr,0,7);m.fill();
    m.globalCompositeOperation='destination-out';m.beginPath();m.arc(mr+2+mr*.45,mr+2-mr*.15,mr*.92,0,7);m.fill();
    x.globalAlpha=.9;x.drawImage(mc,mx-mr-2,my-mr-2);x.globalAlpha=1; }

  // --- the Dyson sphere: a star wrapped in a lattice of collector rings
  const dx=w*.8,dy=Math.max(h*.36,Math.min(h*.4,H0-130*U)),R=Math.min(w*.085,h*.042);
  for(let k=7;k>0;k--)dot(dx,dy,R*(.25+k*.22),'#ffd27a',.05+(7-k)*.012);
  dot(dx,dy,R*.42,'#fff1c8',.95);dot(dx,dy,R*.28,'#ffffff',.9);
  for(let k=0;k<40;k++){const a=r()*6.28,l=R*(1.1+r()*.9);stroke(x,r,dx+Math.cos(a)*l*.6,dy+Math.sin(a)*l*.6,R*.5,3,a,'#ffd27a',.12);}
  x.save();x.translate(dx,dy);x.lineCap='round';
  [0,.55,1.1,1.65,2.2,2.75].forEach((rot,i)=>{x.save();x.rotate(rot);
    x.strokeStyle='#e9b24a';x.globalAlpha=.85;x.lineWidth=1.3;x.beginPath();x.ellipse(0,0,R,R*(.22+i%3*.12),0,0,6.29);x.stroke();
    x.setLineDash([R*.18,R*.1]);x.strokeStyle='#8a6a2e';x.lineWidth=3.2;x.globalAlpha=.8;x.beginPath();x.ellipse(0,0,R,R*(.22+i%3*.12),0,0,3.14);x.stroke();x.setLineDash([]);x.restore();});
  x.globalAlpha=.9;x.strokeStyle='#f2c14b';x.lineWidth=1.5;x.beginPath();x.arc(0,0,R,0,6.29);x.stroke();x.restore();x.globalAlpha=1;

  x.fillStyle='#1a2a3d';x.beginPath();x.moveTo(0,H0);
  for(let i=0;i<=24;i++){const px=i*w/24;x.lineTo(px,H0-(14+Math.sin(i*.9)*9+r()*8)*U);}x.lineTo(w,H0);x.closePath();x.fill();
  for(let k=0;k<60;k++)stroke(x,r,r()*w,H0-r()*20*U,40+r()*80,5+r()*8,(r()-.5)*.2,'#23364c',.35);

  // --- ROME (left): temple, Colosseum, cypresses, aqueduct
  const stone='#2a1e22',glow='#d9823f';
  // temple with pediment and columns
  { const tx=w*.012,tw=30*U,th=26*U,top=H0-th;
    rect(tx-2*U,H0-4*U,tw+4*U,4*U,stone);
    for(let c=0;c<5;c++)rect(tx+c*(tw-4*U)/4,top+7*U,3.6*U,th-11*U,stone);
    x.fillStyle=stone;wob([[tx-3*U,top+7*U],[tx+tw/2,top-4*U],[tx+tw+3*U,top+7*U]],U);x.fill(); }
  // Colosseum: three tiers of arches, broken at the top right
  { const cx=w*.235,cw=56*U,ch=40*U,top=H0-ch,left=cx-cw/2;
    x.fillStyle=stone;wob([[left,H0],[left,top+4*U],[left+cw*.25,top],[left+cw*.7,top],[left+cw*.72,top+9*U],[left+cw,top+13*U],[left+cw,H0]],U);x.fill();
    for(let t=0;t<3;t++)for(let a=0;a<7;a++){const ax=left+4*U+a*(cw-8*U)/7,ay=top+6*U+t*11*U;
      if(t===0&&a>4)continue;x.fillStyle=glow;x.globalAlpha=.55+r()*.3;x.beginPath();x.moveTo(ax,ay+8*U);x.lineTo(ax,ay+3*U);x.arc(ax+2.6*U,ay+3*U,2.6*U,Math.PI,0);x.lineTo(ax+5.2*U,ay+8*U);x.closePath();x.fill();x.globalAlpha=1;} }
  // cypress trees
  [[w*.11,40],[w*.125,30],[w*.335,42]].forEach(([tx,th])=>{x.fillStyle='#131a17';x.beginPath();x.ellipse(tx,H0-th*U/2,3.6*U,th*U/2,0,0,6.29);x.fill();});
  // aqueduct bridging into the industrial age
  { const ax=w*.3,aw=w*.09,ah=22*U,top=H0-ah;rect(ax,top,aw,4*U,stone);
    const n=Math.max(3,Math.round(aw/(9*U)));for(let a=0;a<n;a++){const px=ax+a*aw/n;rect(px,top+4*U,2.6*U,ah-4*U,stone);}
    rect(ax+aw-2.6*U,top+4*U,2.6*U,ah-4*U,stone); }

  // --- INDUSTRIAL (centre-left): sawtooth factory, smokestacks, clock tower
  const brick='#1d1d24',lamp='#e9a03b';
  { const fx=w*.385,fw=w*.12,fh=18*U,top=H0-fh;rect(fx,top,fw,fh,brick);
    const teeth=5;for(let t=0;t<teeth;t++){const px=fx+t*fw/teeth;x.fillStyle=brick;wob([[px,top],[px,top-8*U],[px+fw/teeth,top]],.8*U);x.fill();}
    for(let i=0;i<10;i++)for(let j=0;j<2;j++)if(r()<.7){x.globalAlpha=.55+r()*.35;x.fillStyle=lamp;x.fillRect(fx+3*U+i*(fw-6*U)/10,top+4*U+j*7*U,3*U,3.5*U);x.globalAlpha=1;}
    [[.4,50],[.44,58],[.485,44]].forEach(([sx,sh])=>{const px=w*sx,py=H0-sh*U;rect(px,py,5*U,sh*U,brick);rect(px-1*U,py,7*U,2.5*U,'#2b2b33');
      for(let p=0;p<16;p++){const k=p/16;stroke(x,r,px+2.5*U+k*36*U+r()*6*U,py-6*U-k*55*U-r()*8*U,(10+k*22)*U,(5+k*10)*U,-.3+r()*.4,['#4a5160','#5d6472','#3a404c'][p%3],.4*(1-k*.7));}}); }
  // clock tower with a lit face
  { const px=w*.515,tw=8*U,th=66*U,top=H0-th;rect(px,top,tw,th,brick);
    x.fillStyle=brick;wob([[px-1*U,top],[px+tw/2,top-14*U],[px+tw+1*U,top]],.6*U);x.fill();
    dot(px+tw/2,top+9*U,3.2*U,'#f6d58a',.95);dot(px+tw/2,top+9*U,4.4*U,'#f6d58a',.25); }

  // --- MODERN (centre-right): skyscrapers with lit windows
  const glass='#111a27';
  [[.56,56,11],[.59,84,10],[.618,104,12],[.65,70,11],[.677,90,9],[.705,60,12]].forEach(([sx,sh,sw],i)=>{
    const px=w*sx,ww=sw*U,hh=sh*U,top=H0-hh;rect(px,top,ww,hh,glass);
    if(i===2){rect(px+ww/2-.6*U,top-18*U,1.2*U,18*U,glass);dot(px+ww/2,top-18*U,1.4*U,'#ff6b5a',.9);}
    for(let wy=top+3*U;wy<H0-4*U;wy+=4.2*U)for(let wx=px+2*U;wx<px+ww-2*U;wx+=3.2*U)if(r()<.38){x.globalAlpha=.35+r()*.5;x.fillStyle='#f2c14b';x.fillRect(wx,wy,1.6*U,2*U);x.globalAlpha=1;}});

  const fut='#0e2230',cyan='#5fd6e0';

    const px=w*sx,top=H0-sh*U;x.fillStyle=fut;wob([[px-sw*U/2,H0],[px-sw*U*.18,top+sh*U*.25],[px,top],[px+sw*U*.18,top+sh*U*.25],[px+sw*U/2,H0]],.6*U);x.fill();
    for(let k=0;k<6;k++)dot(px+(r()-.5)*sw*U*.4,top+sh*U*(.2+k*.13),1.1*U,cyan,.75);
    dot(px,top,1.6*U,cyan,.9);});
  // tilted ring around the tallest spire
  x.save();x.translate(w*.795,H0-100*U);x.rotate(-.18);x.strokeStyle=cyan;x.globalAlpha=.75;x.lineWidth=1.6*U;x.beginPath();x.ellipse(0,0,15*U,4*U,0,0,6.29);x.stroke();x.restore();x.globalAlpha=1;
  // glowing dome
  { const cx=w*.895,rad=17*U;x.fillStyle=fut;x.beginPath();x.ellipse(cx,H0,rad,rad*.85,0,Math.PI,0);x.fill();
    x.strokeStyle=cyan;x.globalAlpha=.55;x.lineWidth=1;for(let k=1;k<4;k++){x.beginPath();x.ellipse(cx,H0,rad*k/4,rad*.85,0,Math.PI,0);x.stroke();}

  // space elevator: a hair-thin cable to the top of the sky with a climber on it
  { const ex=w*.975;x.strokeStyle='#9fe3ea';x.globalAlpha=.5;x.lineWidth=1;x.beginPath();x.moveTo(ex,H0);x.lineTo(ex,0);x.stroke();
    x.globalAlpha=1;rect(ex-2*U,H0*.42,4*U,5*U,'#cfeff2');rect(ex-5*U,H0-6*U,10*U,6*U,fut); }
  // rocket climbing on a plume
  { const rx=w*.87,ry=H0-138*U;
    for(let k=0;k<26;k++){const t=k/26;stroke(x,r,rx+(r()-.5)*4*U*t,ry+14*U+t*(H0-ry-20*U),14*U,(3+t*7)*U,Math.PI/2+(r()-.5)*.2,['#fff3dc','#f2c14b','#e8862a','#8a93a0'][Math.min(3,Math.floor(t*4))],.5*(1-t*.5));}
    x.fillStyle='#e8edf2';wob([[rx-2.4*U,ry+14*U],[rx-2.4*U,ry+3*U],[rx,ry-3*U],[rx+2.4*U,ry+3*U],[rx+2.4*U,ry+14*U]],.3*U);x.fill();
    dot(rx,ry+16*U,2.6*U,'#fff1c8',.9); }

  // --- ground and river: a dark band with reflected lights
  x.fillStyle='#0a121c';x.fillRect(0,H0,w,h-H0);
  for(let k=0;k<260;k++)stroke(x,r,r()*w,H0+r()*(h-H0),40+r()*140,5+r()*10,(r()-.5)*.06,['#101c2a','#0c1622','#16263a','#0a1018'][k%4],.5);
  for(let k=0;k<70;k++){const px=r()*w,c=px<w*.3?'#d9823f':px<w*.52?'#e9a03b':px<w*.73?'#f2c14b':'#5fd6e0';
    stroke(x,r,px,H0+6+r()*h*.07,8+r()*22,2+r()*3,(r()-.5)*.05,c,.18);}
  x.globalAlpha=.35;x.fillStyle='#f2c14b';x.fillRect(0,H0,w,1);x.globalAlpha=1;

  // --- a final light pass of brush texture so everything reads as one painting
  for(let k=0;k<160;k++)stroke(x,r,r()*w,r()*h,30+r()*90,6+r()*12,(r()-.5)*.4,['#ffffff','#000000'][k%2],.035);
}
